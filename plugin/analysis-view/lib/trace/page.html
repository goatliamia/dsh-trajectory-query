/* 页面自己占满视口:整页不滚动,滚动只发生在图区内部的平移/缩放上。 */
html, body { height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; align-items: stretch; }

.geist-review .app { height: auto; flex: 1 1 auto; min-height: 0; width: 100%; max-width: none; margin: 0; }

/* 短面板的行动路径:轴注记与修改行会撞在一起,先收掉注记,保留图例与开关。 */
@media (max-height: 800px) {
  .geist-review .review-action-mode .br-axis { display: none; }

/* 顶栏整行去掉:只把「每轮耗时 / 行动路径 / 返回全景 / 缩放」留在底部一条工具行。 */
.geist-review .app { order: 1; }
.geist-review .review-toolbar {

.geist-review .geist-edition,

.geist-review .geist-context-sources button { font-size: 12px; line-height: 18px; gap: 5px; }

  .geist-context-sources { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* 平移是运输,不是重排:把画布提升为合成层,滚动只做位移,不重画。 */
.geist-review #graph-wrap { will-change: transform; }

.geist-review .review-action-mode .geist-context-total strong{font-size:20px;line-height:24px}

.geist-review .review-action-mode .geist-context-meter{grid-column:1;grid-row:2;align-self:center;height:10px}

@media(max-width:600px){.geist-review .review-action-mode .geist-context-total{grid-column:1 / -1}.geist-review .review-action-mode .geist-context-meter{grid-column:1 / -1;grid-row:3}.geist-review .review-action-mode .geist-context-model{display:none}}

<body class="geist-review">
<div class="review-toolbar"><button id="review-return" hidden>← 返回执行全景</button><strong>执行路径</strong><span class="geist-edition">02</span><small id="review-state">105 轮真实记录</small><span class="review-spacer"></span><button id="review-rounds">每轮耗时</button><button id="review-path">行动路径 ↗</button><button id="review-stress" aria-pressed="false">密集样本</button><div class="review-controls" id="review-overview-controls"><button id="review-out" aria-label="缩小">−</button><button id="review-fit">全览</button><button id="review-in" aria-label="放大">＋</button></div></div><div class="app">
  <div class="top"><span class="mark" aria-hidden="true">d</span><span>DSH</span><span class="slash">/</span><strong>执行路径</strong><button class="back-link" id="parent-button" hidden>← 主会话</button><span class="spacer"></span><button class="source-btn" id="source-button">查看数据来源 ↗</button></div>
  <header class="heading"><div><h1 id="page-title">执行路径</h1><div class="session-name" id="session-name"></div></div><div class="session-facts" id="session-facts"></div></header>

      <div class="canvas-bar"><div class="segmented" aria-label="查看方式"><button id="overview-button" aria-pressed="false">轮次概览</button><button id="path-button" aria-pressed="true">行动路径</button></div><button class="back-link" id="back-button" hidden>↖ 返回整轮</button><span class="spacer"></span><div class="step-controls"><button class="icon-btn" id="previous" aria-label="上一轮">‹</button><span class="count-label mono" id="count-label"></span><button class="icon-btn" id="next" aria-label="下一轮">›</button></div></div>
      <div class="turn-strip"><span class="strip-title">轮次</span><nav class="turn-list" id="turn-list" aria-label="轮次导航"></nav><span class="strip-title" id="strip-total">54 轮</span></div>
      <section class="turn-heading" id="turn-heading"></section><div class="graph-scroll" id="graph-scroll"><div class="graph-wrap" id="graph-wrap"><svg id="graph" role="group" aria-label="从左到右推进的执行路径"></svg></div></div>

    </main>
  </div>
</div>
<script id="trace-data" type="application/json">/*__TRACE_DATA__*/</script>
<script>/*__TRACE_RENDERER__*/</script>
<script>
(() => {
  const element = document.getElementById('trace-data');
  const payload = JSON.parse(element.textContent);
  element.textContent = '';
  window.__geistPayload = payload;
  let booted = false;
  const merge = (target, patch) => {
    for (const key of Object.keys(patch)) {
      const value = patch[key], current = target[key];
      if (value && typeof value === 'object' && !Array.isArray(value) && current && typeof current === 'object' && !Array.isArray(current)) merge(current, value);
      else target[key] = value;
    }
  };
  const boot = () => {
    if (booted) return;
    booted = true;
    // 渲染炸了也要留下话说,而不是一张空白页。
    try {
      window.__geistBoot();
    } catch (error) {
      window.__renderGuard = String((error && error.message) || error);
      const box = document.createElement('pre');
      box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;margin:0;padding:8px 12px;background:#fff3f3;color:#a00;font:12px/1.5 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto';
      box.textContent = '执行路径渲染失败:' + window.__renderGuard + '\n' + String((error && error.stack) || '');
      document.body.appendChild(box);
    }
  };
  window.addEventListener('message', event => {
    if (event.origin !== location.origin) return;
    const message = event.data;
    if (!message || message.type !== 'analysis-trace-data' || !message.payload) return;
    merge(payload, message.payload);
    boot();
  });
  if (window.parent !== window) window.parent.postMessage({ type: 'analysis-trace-ready' }, location.origin);
  // A view that cannot supply official values still gets the base graph.
  setTimeout(boot, 2000);
})();
</script>
